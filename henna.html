<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة حفل حنة</title>
<meta name="theme-color" content="#141217">

<meta property="og:title" content="دعوة حفل حنة علي عبدالكاظم البهادلي">
<meta property="og:description" content="أتشرف بدعوتكم لمشاركتي حفل حنتي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="henna.css">
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="orn" viewBox="0 0 120 16">
    <path d="M0 8h48M72 8h48" stroke="currentColor" stroke-width=".8" fill="none"/>
    <path d="M60 2l6 6-6 6-6-6z" stroke="currentColor" stroke-width=".8" fill="none"/>
    <circle cx="60" cy="8" r="1.4" fill="currentColor"/>
  </symbol>
</svg>


<section class="intro" id="intro">
  <button class="env" id="openBtn" type="button" aria-label="افتح الدعوة">
    <span class="card"><b> دعوة</b></span>
    <span class="flap"></span>
    <span class="seal"></span>
  </button>
  <p class="hint">اضغط على الظرف لفتح الدعوة 💌</p>
</section>


<main class="page" id="page" inert>
  <header class="hero">
    <h1 class="dawa rv"> دعوة</h1>
    <div class="photo-wrap rv" id="photoWrap"><img id="groomPhoto" alt=""></div>
    <div class="lines" id="lines"></div>
    <svg class="orn rv" viewBox="0 0 120 16" aria-hidden="true"><use href="#orn"/></svg>
    <h2 class="groom rv" id="groomName"></h2>
    <p class="when rv" id="whenText"></p>
    <p class="vline rv" id="venueLine"></p>
  </header>

  <section class="block rv">
    <h3 id="cdTitle">باقٍ على الحفل</h3>
    <div class="count" role="timer">
      <div><b id="cd-d">٠٠</b><span>يوم</span></div>
      <div><b id="cd-h">٠٠</b><span>ساعة</span></div>
      <div><b id="cd-m">٠٠</b><span>دقيقة</span></div>
      <div><b id="cd-s">٠٠</b><span>ثانية</span></div>
    </div>
  </section>

  <section class="block rv">
    <h3>مكان الحفل</h3>
    <p class="venue-name" id="venueName"></p>
    <p class="venue-addr" id="venueAddr"></p>
    <a class="btn btn-gold" id="mapBtn" target="_blank" rel="noopener">فتح الموقع</a>
  </section>

  <section class="block guest rv">
    <h3>دفتر التهاني 💌</h3>
    <form id="wishForm" autocomplete="off">
      <label for="gName">الاسم</label>
      <input id="gName" maxlength="40" required>
      <label for="gMsg">رسالتك</label>
      <textarea id="gMsg" maxlength="300" rows="3" required></textarea>
      <button class="btn btn-gold" type="submit">إرسال التهنئة ❤️</button>
    </form>
    <div class="wishes" id="wishes"></div>
  </section>

  <footer class="block rv">
    <button class="btn btn-line" id="shareBtn" type="button">مشاركة الدعوة على واتساب</button>
    <p class="foot">حضوركم يكمل فرحتي</p>
  </footer>
  <p class="credit">
  صُمّمت هذه الدعوة بواسطة
  <a href="https://instagram.com/narjizaen" target="_blank" rel="noopener">@narjizaen</a>
  — لطلب دعوتك تواصل معي
</p>
</main>

<button class="music" id="musicBtn" type="button" aria-label="تشغيل الموسيقى" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg>
</button>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="henna.js"></script>
</body>
</html>
